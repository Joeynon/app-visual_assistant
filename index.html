<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視覺助理</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: #00d4ff; }
        .container {
            display: flex;
            gap: 20px;
            max-width: 900px; /* 畫面變小 */
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .video-container, .response-container {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 300px;
        }
        /* 縮小攝影機與圖片畫面 */
        video, canvas {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            background: #0f0f23;
            display: block;
            margin: 0 auto;
        }
        #response {
            width: 100%;
            border-radius: 8px;
            background: #0f0f23;
            min-height: 250px;
            padding: 15px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        #captureBtn {
            background: #00d4ff;
            color: #1a1a2e;
        }
        #askBtn {
            background: #7c3aed;
            color: white;
        }
        #speakBtn {
            background: #0ea5e9;
            color: white;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #question {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f0f23;
            color: #eee;
            font-size: 14px;
            margin-bottom: 15px;
        }
        #question:focus { outline: 2px solid #00d4ff; }
        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .loading { background: #fbbf24; color: #1a1a2e; }
